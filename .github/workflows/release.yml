name: Build and publish release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.version.outputs.package }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          prerelease_id="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          build_id='[0-9A-Za-z-]+'
          semver="^$number\.$number\.$number(-$prerelease_id(\.$prerelease_id)*)?(\+$build_id(\.$build_id)*)?$"
          version=${GITHUB_REF_NAME#v}
          # A non-version tag still gets a release with the manifest's package version.
          # 非版本号 tag 也会发布，安装包沿用清单中的版本号。
          if [[ ! $version =~ $semver ]]; then
            version=$(cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "pingpingping") | .version')
          fi
          base_version=${version%%+*}
          prerelease=false
          if [[ $base_version == *-* ]]; then
            prerelease=true
          fi
          {
            printf 'package=%s\n' "$version"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    environment: windows-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.package }}
      WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust MSVC toolchain
        shell: powershell
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Log in to Azure for signing
        if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure Azure Artifact Signing
        if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if (!$env:SIGNING_ENDPOINT -or !$env:SIGNING_ACCOUNT -or !$env:SIGNING_PROFILE) {
            throw 'Set AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, and AZURE_SIGNING_PROFILE.'
          }
          $sdkTools = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          $signTool = Get-ChildItem -Path $sdkTools -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK SignTool was not found.' }

          $client = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          $archive = "$client.zip"
          $packageUrl = 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg'
          Invoke-WebRequest -Uri $packageUrl -OutFile $archive
          $expectedHash = '35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Artifact Signing client checksum did not match.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $client
          $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (!(Test-Path -LiteralPath $dlib -PathType Leaf)) { throw 'Artifact Signing Dlib was not found.' }

          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
          $signArgs = ConvertTo-Json -Compress -InputObject @('/tr', 'http://timestamp.acs.microsoft.com', '/dlib', $dlib, '/dmdf', $metadata)
          "PINGPINGPING_SIGNTOOL_PATH=$($signTool.FullName)" >> $env:GITHUB_ENV
          "PINGPINGPING_SIGNTOOL_ARGS=$signArgs" >> $env:GITHUB_ENV
      - name: Build size-optimized installer and portable ZIP
        shell: powershell
        run: |
          $sign = $env:WINDOWS_SIGNING_ENABLED -eq 'true'
          if (!$sign) { Write-Host '::notice::Windows code signing is disabled.' }
          .\script\package-windows.ps1 -Version $env:RELEASE_VERSION -Sign:$sign
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/windows/PingPingPing-${{ env.RELEASE_VERSION }}-windows-x64-setup.exe
            dist/windows/PingPingPing-${{ env.RELEASE_VERSION }}-windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS Apple Silicon
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PINGPINGPING_RELEASE_VERSION: ${{ needs.version.outputs.package }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build size-optimized app ZIP
        run: |
          ./script/build-macos-release.sh --size
          ditto -c -k --sequesterRsrc --keepParent dist/PingPingPing.app \
            "dist/PingPingPing-$PINGPINGPING_RELEASE_VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/PingPingPing-${{ env.PINGPINGPING_RELEASE_VERSION }}-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [version, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.package }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          assets=(
            "release-assets/windows-x64/PingPingPing-$RELEASE_VERSION-windows-x64-setup.exe"
            "release-assets/windows-x64/PingPingPing-$RELEASE_VERSION-windows-x64-portable.zip"
            "release-assets/macos-arm64/PingPingPing-$RELEASE_VERSION-macos-arm64.zip"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s $asset ]]; then
              printf 'Missing or empty release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done
          options=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ $PRERELEASE == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "${options[@]}" -- "$GITHUB_REF_NAME" "${assets[@]}"
